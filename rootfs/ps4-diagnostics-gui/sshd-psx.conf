# Public images require local enrollment; an owner image may seed a public key.
Port 22
HostKey /run/psx-ssh/ssh_host_ed25519_key
AuthorizedKeysFile /etc/psx-diagnostics/authorized_keys /root/.ssh/authorized_keys
PermitRootLogin prohibit-password
AllowUsers root
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
UsePAM yes
StrictModes yes
