[package]
name = "psx-diagnostics-tui"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Small native PS4 diagnostic console and SSH client"
publish = false

[dependencies]
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
serde_json = "=1.0.149"
qrcodegen = "=1.8.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
