name: PS4 - Linux 6.x

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish an experimental prerelease after build checks pass
        type: boolean
        default: false

permissions:
  contents: read

env:
  BUILD_TARGET: 6.18-ps4-baikal

concurrency:
  group: ps4-linux-6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PS4 Linux 6.x build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install native x86-64 build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison cpio dwarves flex gcc git kmod libelf-dev libssl-dev make python3 rsync xz-utils zstd binutils
      - name: Check provenance and host contracts
        run: |
          case "$BUILD_TARGET" in
            6.18-ps4-baikal) ;;
            *) echo 'Unsupported release target' >&2; exit 1 ;;
          esac
          make check
      - name: Build distribution-independent PS4 target
        env:
          PSX_KERNEL_BUILDER_IMAGE: github-ubuntu-24.04-native
        run: ./build.sh --target "$BUILD_TARGET"
      - name: Package matching kernel, modules and corresponding source
        run: ./scripts/ci/package-release --target "$BUILD_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        name: Upload kernel download
        with:
          name: linux-psx-${{ env.BUILD_TARGET }}-${{ github.sha }}
          path: dist/runtime/*
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        name: Upload corresponding source separately
        with:
          name: linux-psx-${{ env.BUILD_TARGET }}-source-${{ github.sha }}
          path: dist/source/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: PS4 Linux 6.x prerelease
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/master' && github.repository == 'meerzulee/linux-psx'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-psx-${{ env.BUILD_TARGET }}-${{ github.sha }}
          path: dist/runtime
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-psx-${{ env.BUILD_TARGET }}-source-${{ github.sha }}
          path: dist/source
      - name: Verify both downloads and assemble release assets
        run: ./scripts/ci/package-release --assemble-release --runtime dist/runtime --source dist/source --destination release --expected-commit "$GITHUB_SHA"
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - "$BUILD_TARGET" "$GITHUB_SHA" <<'PY'
          import json, sys
          target = json.load(open(f"provenance/{sys.argv[1]}.json"))
          artifact = json.load(open("release/artifacts.json"))
          for key in ("target", "platform", "kernel_release"):
              if artifact[key] != target[key]:
                  raise SystemExit(f"Release {key} differs from selected target")
          if artifact["source_commit"] != sys.argv[2] or artifact["embedded_firmware"] is not False:
              raise SystemExit("Release commit or firmware policy differs")
          PY
          cd release
          sha256sum -c SHA256SUMS
          version=$(python3 -c 'import json; print(json.load(open("artifacts.json"))["kernel_release"])')
          gh release create "v$version" ./* --target "$GITHUB_SHA" --prerelease --latest=false --title "Experimental PS4 Baikal — $version" --notes-file RELEASE-NOTES.md
