name: Report a result
description: Tell us what happened when you ran a Linux psX kernel or DiagnostiX on your console. A failed boot counts.
title: "Report: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. A boot that failed is as useful as one that worked.

        Put your console model and southbridge in the title, for example `Report: CUH-2215B, Baikal`.

        **Never post** firmware or PUP files, keys, or a used USB drive image. Remove MAC and IP addresses, Wi-Fi network names, serial numbers and console IDs from anything you attach. See [what to keep private](https://linux.mrz.sh/results-and-reports/#what-to-keep-private).

  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - It works
        - It works, with a problem
        - It boots, then hangs or crashes
        - It doesn't boot
        - My console isn't supported yet and I'd like to help port it
    validations:
      required: true

  - type: input
    id: console-model
    attributes:
      label: Console model
      description: Printed on the label on your console.
      placeholder: CUH-2215B
    validations:
      required: true

  - type: dropdown
    id: southbridge
    attributes:
      label: Southbridge
      description: "Not sure? See [how to find it](https://linux.mrz.sh/compatibility/#finding-out-which-one-you-have)."
      options:
        - Baikal
        - Belize 2
        - Belize
        - Aeolia
        - Not sure
    validations:
      required: true

  - type: input
    id: console-firmware
    attributes:
      label: Console firmware version
      description: "On the console, go to Settings, System, System Information."
      placeholder: "12.02"
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel
      description: "The output of `uname -r`. If Linux didn't start, the kernel you downloaded. If you haven't run one yet, write none."
      placeholder: 7.2.11-psx-ps4-baikal-uvd-runtime-dev6
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: What you ran
      description: "DiagnostiX, Omarchy psX, or your distribution and its Mesa version. If you haven't run anything yet, write none."
      placeholder: Arch Linux with Mesa 25.1
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: "What you did, what you expected and what you saw. If it stopped, say what was on the screen and how long you waited."
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: "The loader and video memory size, the initramfs, any firmware you added, and the SHA256 of your download if you have it."
      placeholder: PS4 Linux Loader v25, 1 GiB video memory

  - type: textarea
    id: logs
    attributes:
      label: Logs and reports
      description: "Drag your DiagnostiX report or log files here, or paste `dmesg` between lines of three backticks. For a console that isn't supported yet, include `lspci -nn` and `dmesg`. Read through them first."

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send
      options:
        - label: I removed personal details, and this report contains no firmware, PUP files or keys.
          required: true
